<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Kanban App</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 0; color: #333; }
        header { background: #333; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #fff; text-decoration: none; margin-left: 15px; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 20px; }
        .btn { background: #007bff; color: white; padding: 8px 15px; border: none; border-radius: 4px; text-decoration: none; cursor: pointer; }
        .btn-danger { background: #dc3545; }
        .btn:hover { opacity: 0.9; }
        form p { margin-bottom: 10px; }
        form input, form select, form textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        .errorlist { color: red; font-size: 0.9em; list-style: none; padding: 0; }
    </style>
</head>
<body>
    <header>
        <h2><a href="{% url 'dashboard' %}" style="margin:0;">Мой Канбан</a></h2>
        <div>
            {% if user.is_authenticated %}
                <span>Привет, {{ user.username }}!</span>
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none; border:none; color:white; cursor:pointer; margin-left:15px; font-size:1rem;">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </div>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
